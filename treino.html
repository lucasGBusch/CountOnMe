<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Treinos - CountOnMe</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="stylesheet" href="css/treino.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- BOTÃO FIXO: abre/fecha a sidebar -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-expanded="false" aria-controls="sidebar">
        <span class="toggle-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
        <span class="toggle-brand">CountOnMe</span>
    </button>

    <!-- FUNDO ESCURECIDO ATRÁS DA SIDEBAR ABERTA -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- SIDEBAR NAVIGATION -->
    <aside id="sidebar" class="sidebar">
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </span> Início
            </a>
            <a href="dashboard.html#calculators" class="nav-item">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><circle cx="8" cy="11" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="0.8" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="0.8" fill="currentColor" stroke="none"/><circle cx="8" cy="15" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="0.8" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="0.8" fill="currentColor" stroke="none"/><circle cx="8" cy="19" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="0.8" fill="currentColor" stroke="none"/></svg>
                </span> Calculadoras
            </a>
            <a href="treino.html" class="nav-item active">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="4" height="6" rx="1"/><rect x="19" y="9" width="4" height="6" rx="1"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="5" y1="7" x2="5" y2="17"/><line x1="19" y1="7" x2="19" y2="17"/></svg>
                </span> Meus Treinos
            </a>
            <a href="diario.html" class="nav-item">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                </span> Dieta &amp; Macros
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="login.html" id="btn-logout" class="btn-logout">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </span> Sair
            </a>
        </div>
    </aside>

    <div class="container">
        <!-- CABEÇALHO -->
        <header class="header">
            <h1>💪 Registro de Treino</h1>
            <p>Organize suas fichas e acompanhe sua evolução de carga</p>
        </header>

        <!-- CRONÔMETRO DE DESCANSO -->
        <div class="timer-card">
            <div class="timer-header">
                <span>⏱️ Timer de Descanso</span>
                <span id="timer-display" class="timer-time">00:00</span>
            </div>
            <div class="timer-presets">
                <button class="btn-timer" data-sec="30">30s</button>
                <button class="btn-timer" data-sec="45">45s</button>
                <button class="btn-timer" data-sec="60">60s</button>
                <button class="btn-timer" data-sec="90">90s</button>
                <button class="btn-timer" data-sec="120">2m</button>
                <button id="btn-timer-stop" class="btn-timer-stop">⏹ Parar</button>
            </div>
        </div>

        <!-- SELETOR DE FICHAS (TABS A / B / C) -->
        <div class="workout-tabs">
            <button class="tab-btn active" data-tab="a">
                <strong id="tab-title-a">Treino A</strong>
                <span id="tab-sub-a">Peito / Tríceps</span>
            </button>
            <button class="tab-btn" data-tab="b">
                <strong id="tab-title-b">Treino B</strong>
                <span id="tab-sub-b">Costas / Bíceps</span>
            </button>
            <button class="tab-btn" data-tab="c">
                <strong id="tab-title-c">Treino C</strong>
                <span id="tab-sub-c">Pernas / Ombros</span>
            </button>
        </div>

        <!-- REGISTRO DE NOVO EXERCÍCIO -->
        <div class="add-exercise-section">
            <h4>Adicionar Exercício à Ficha</h4>
            <form id="form-add-exercise">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="exercise-name">Nome do Exercício</label>
                        <input type="text" id="exercise-name" placeholder="Ex: Supino Reto com Barra" class="input-text" required>
                    </div>

                    <div class="input-group">
                        <label for="exercise-weight">Carga (kg)</label>
                        <input type="number" id="exercise-weight" placeholder="Ex: 60" min="0" step="0.5" class="input-num" required>
                    </div>

                    <div class="input-group">
                        <label for="exercise-sets">Séries</label>
                        <input type="number" id="exercise-sets" placeholder="Ex: 4" min="1" max="10" value="4" class="input-num" required>
                    </div>

                    <div class="input-group">
                        <label for="exercise-reps">Repetições</label>
                        <input type="text" id="exercise-reps" placeholder="Ex: 10 a 12" class="input-text" required>
                    </div>
                </div>

                <button type="submit" class="btn-add">+ Adicionar à Ficha</button>
            </form>
        </div>

        <!-- LISTA DE EXERCÍCIOS DA FICHA ATIVA -->
        <div class="workout-list-container">
            <div class="list-header">
                <div class="list-title-group">
                    <h4 id="current-tab-title">Exercícios — Treino A</h4>
                    <button id="btn-edit-tab-name" class="btn-inline-edit" title="Editar Nome da Ficha">✏️ Renomear Ficha</button>
                </div>
                <span id="total-exercises-badge" class="badge">0 exercícios</span>
            </div>

            <div id="exercise-list" class="exercise-list">
                <!-- Preenchido via JS dinamicamente -->
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO DE EXERCÍCIO -->
    <div id="modal-edit-exercise" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h4>✏️ Editar Exercício</h4>
                <button id="btn-close-edit-modal" class="btn-close">&times;</button>
            </div>
            <form id="form-edit-exercise">
                <input type="hidden" id="edit-exercise-id">
                
                <div class="input-group">
                    <label for="edit-exercise-name">Nome do Exercício</label>
                    <input type="text" id="edit-exercise-name" class="input-text" required>
                </div>

                <div class="form-grid-modal">
                    <div class="input-group">
                        <label for="edit-exercise-weight">Carga (kg)</label>
                        <input type="number" id="edit-exercise-weight" min="0" step="0.5" class="input-num" required>
                    </div>
                    <div class="input-group">
                        <label for="edit-exercise-sets">Séries</label>
                        <input type="number" id="edit-exercise-sets" min="1" max="10" class="input-num" required>
                    </div>
                    <div class="input-group">
                        <label for="edit-exercise-reps">Repetições</label>
                        <input type="text" id="edit-exercise-reps" class="input-text" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancel-edit" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE RENOMEAR FICHA -->
    <div id="modal-edit-tab" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h4>🏷️ Renomear Ficha</h4>
                <button id="btn-close-tab-modal" class="btn-close">&times;</button>
            </div>
            <form id="form-edit-tab">
                <div class="input-group">
                    <label for="edit-tab-title-input">Nome Principal (ex: Treino A)</label>
                    <input type="text" id="edit-tab-title-input" class="input-text" required>
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label for="edit-tab-sub-input">Músculos / Foco (ex: Peito / Tríceps)</label>
                    <input type="text" id="edit-tab-sub-input" class="input-text" required>
                </div>
                <div class="modal-actions" style="margin-top: 15px;">
                    <button type="button" id="btn-cancel-tab-edit" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Ficha</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/treino.js"></script>
    <script>
        // Controla apenas abrir/fechar a sidebar — não mexe na lógica do treino.js
        (function () {
            const toggleBtn = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            function setOpen(open) {
                sidebar.classList.toggle('open', open);
                backdrop.classList.toggle('open', open);
                toggleBtn.classList.toggle('open', open);
                toggleBtn.setAttribute('aria-expanded', open);
            }

            toggleBtn.addEventListener('click', () => {
                setOpen(!sidebar.classList.contains('open'));
            });

            backdrop.addEventListener('click', () => setOpen(false));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') setOpen(false);
            });

            // Fecha a sidebar ao escolher um item de navegação
            sidebar.querySelectorAll('.nav-item, .btn-logout').forEach((link) => {
                link.addEventListener('click', () => setOpen(false));
            });
        })();
    </script>
</body>
</html>
